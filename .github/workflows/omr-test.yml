name: omr-test
# 변환 엔진 회귀 시험: 공개 악보(예제·직접 만든 연습곡)를 PDF로 만든 뒤 Audiveris로 다시 읽어 원본과 음 단위로 비교한다.
on:
  pull_request:
    paths: ["omr/**", ".github/workflows/omr*.yml"]
  workflow_dispatch:
jobs:
  roundtrip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: /tmp/aud
          key: audiveris-5.11.0-ubuntu24.04
      - name: 도구 설치 (MuseScore, Audiveris)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musescore3 xvfb >/dev/null
          mkdir -p /tmp/aud /tmp/audx
          ls /tmp/aud/*.deb >/dev/null 2>&1 || gh release download 5.11.0 -R Audiveris/audiveris --pattern '*ubuntu24.04*.deb' -D /tmp/aud
          dpkg-deb -x /tmp/aud/*.deb /tmp/audx
      - name: 시험 악보를 PDF로
        run: |
          mkdir -p /tmp/pdf
          for f in omr/test/*.musicxml; do n=$(basename "$f" .musicxml); QT_QPA_PLATFORM=offscreen mscore3 -o "/tmp/pdf/$n.pdf" "$f" >/dev/null 2>&1 || xvfb-run -a mscore3 -o "/tmp/pdf/$n.pdf" "$f"; done
          ls -la /tmp/pdf
      - name: Audiveris로 다시 읽기
        run: python omr/worker.py --local /tmp/pdf /tmp/omrout --audiveris /tmp/audx/opt/audiveris/bin/Audiveris
      - name: 원본과 비교 (음높이·시작·길이·손 100% 일치해야 통과)
        run: |
          python build.py
          npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
          node tests/omr_compare.js omr/test /tmp/omrout
      - name: 변환 서버(Docker) 만들기
        run: docker build -t gunban-omr omr
      - name: 변환 서버로 다시 읽기 (앱과 같은 방식으로 파일 그대로 POST)
        run: |
          docker run -d --name omr -p 7860:7860 gunban-omr
          for i in $(seq 1 60); do curl -fs localhost:7860/health && break; sleep 1; done; echo
          curl -fsi -X OPTIONS localhost:7860/convert -H 'Origin: https://luckydodo777.github.io' | grep -i 'access-control-allow-origin'
          mkdir -p /tmp/srvout
          f0=$(ls /tmp/pdf/*.pdf | head -1)
          code=$(curl -s -o /tmp/r0.json -w '%{http_code}' -X POST localhost:7860/convert -H 'Content-Type: application/pdf' -H 'X-File-Name: t.pdf' --data-binary "@$f0")
          if [ "$code" != "200" ]; then
            echo "::warning::server status $code: $(head -c 300 /tmp/r0.json)"
            docker cp "$f0" omr:/tmp/x.pdf
            docker exec omr sh -c 'xvfb-run -a /opt/audiveris/bin/Audiveris -batch -transcribe -export -output /tmp/o /tmp/x.pdf 2>&1 | tail -25' > /tmp/aud.log 2>&1 || true
            while IFS= read -r line; do echo "::warning::aud: ${line:0:250}"; done < /tmp/aud.log
            docker exec omr sh -c 'ls /opt/audiveris/bin /opt/audiveris/lib | head; id; echo $HOME' | while IFS= read -r line; do echo "::warning::env: $line"; done
            exit 1
          fi
          for f in /tmp/pdf/*.pdf; do n=$(basename "$f" .pdf); s=$(date +%s)
            curl -fsS -X POST localhost:7860/convert -H 'Content-Type: application/pdf' -H "X-File-Name: $n.pdf" --data-binary "@$f" -o "/tmp/srvout/$n.json"
            python -c "import json,sys; d=json.load(open(sys.argv[1])); open(sys.argv[2],'w').write(d['xml']); print(sys.argv[3], d['info'])" "/tmp/srvout/$n.json" "/tmp/srvout/$n.musicxml" "$n"
            echo "$n: 왕복 $(( $(date +%s) - s ))초"; done
          docker logs omr | tail -5
      - name: 변환 서버 결과도 원본과 비교
        run: node tests/omr_compare.js omr/test /tmp/srvout
